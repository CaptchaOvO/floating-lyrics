[project]
name = "floating-lyrics"
version = "0.1.0"
description = "Windows 桌面悬浮歌词软件（Spotify/GSMTC + LRCLIB）"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 行长交给 formatter/人工把关
    "B008",   # Qt 默认参数（如 QWidget parent）在函数调用中出现
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
